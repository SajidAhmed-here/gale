# Build and test GALE without publishing or requiring repository secrets.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Avoid nested numerical-library threads during LIME and bootstrap tests.
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLBACKEND: Agg

    steps:
      - name: Checkout gale library
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            setup.py
            .github/workflows/build.yml

      - name: Install dependencies and package
        # Keep the numerical stack stable for the existing numerical fixtures.
        # These versions satisfy requirements.txt and setup.py on Python 3.11.
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt . pytest pytest-cov build twine "numpy==1.26.4" "scipy==1.11.4" "scikit-learn==1.3.2"
          python -m pip check

      - name: Test with pytest
        run: python -m pytest tests --durations=10 --cov=gale --cov-report=term-missing --cov-report=xml

      - name: Build source distribution and wheel
        run: |
          python -m build
          python -m twine check dist/*

      - name: Verify wheel installation
        # Import outside the checkout so the source tree cannot mask a bad wheel.
        run: |
          python -m venv "${RUNNER_TEMP}/gale-wheel"
          "${RUNNER_TEMP}/gale-wheel/bin/python" -m pip install dist/*.whl "numpy==1.26.4" "scipy==1.11.4" "scikit-learn==1.3.2"
          "${RUNNER_TEMP}/gale-wheel/bin/python" -m pip check
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/gale-wheel/bin/python" -c "from gale import create_mapper, create_pd, bottleneck_distance, bootstrap_mapper_params, mapper_to_networkx"

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: gale-distributions
          path: dist/*
          if-no-files-found: error

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: gale-coverage
          path: coverage.xml
          if-no-files-found: warn
