# Build and test GALE without publishing or requiring repository secrets.
name: build

on:
  push:
    branches: [main, ci/legacy-compatibility]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"
            runtime: "numpy==1.23.2 scipy==1.9.1 scikit-learn==1.1.2 gudhi==3.6.0 kmapper==2.0.1 networkx==2.8.6 lime==0.2.0.1"
          - python: "3.11"
            runtime: "numpy==1.23.5 scipy==1.9.3 scikit-learn==1.1.3 gudhi==3.7.0 kmapper==2.0.1 networkx==2.8.8 lime==0.2.0.1"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Avoid nested numerical-library threads during LIME and bootstrap tests.
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLBACKEND: Agg

    steps:
      - name: Checkout gale library
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            setup.py
            .github/workflows/build.yml

      - name: Install dependencies and package
        # Keep the numerical stack stable for the existing numerical fixtures.
        # These versions satisfy requirements.txt and setup.py on Python 3.11.
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt . pytest pytest-cov build twine ${{ matrix.runtime }}
          python -m pip check

      - name: Test with pytest
        run: python -m pytest tests --durations=10 --cov=gale --cov-report=term-missing --cov-report=xml

      - name: Build source distribution and wheel
        run: |
          python -m build
          python -m twine check dist/*

      - name: Verify wheel installation
        # Import outside the checkout so the source tree cannot mask a bad wheel.
        run: |
          python -m venv "${RUNNER_TEMP}/gale-wheel"
          "${RUNNER_TEMP}/gale-wheel/bin/python" -m pip install dist/*.whl ${{ matrix.runtime }}
          "${RUNNER_TEMP}/gale-wheel/bin/python" -m pip check
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/gale-wheel/bin/python" -c "from gale import create_mapper, create_pd, bottleneck_distance, bootstrap_mapper_params, mapper_to_networkx"

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: gale-distributions-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: gale-coverage-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: warn
